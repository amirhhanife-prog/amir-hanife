<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="dd css.css">
<meta charset="UTF-8">
<title>Benz Jump Game</title>
<style>
    body {
        background: #eee;
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
    }

    #game {
        width: 800px;
        height: 300px;
        background: white;
        border: 2px solid #444;
        margin: 40px auto;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    #car {
        width: 60px;
        height: 40px;
        background: red; 
        position: absolute;
        bottom: 0;
        left: 50px;
        border-radius: 5px;
    }

    #obstacle {
        width: 30px;
        height: 40px;
        background: black;
        position: absolute;
        bottom: 0;
        right: -50px;
        animation: move 2s infinite linear;
    }

    @keyframes move {
        0% { right: -50px; }
        100% { right: 850px; }
    }

    .jump {
        animation: jump 0.6s ease;
    }

    @keyframes jump {
        0% { bottom: 0; }
        50% { bottom: 120px; }
        100% { bottom: 0; }
    }

    #message {
        text-align: center;
        font-size: 22px;
        margin-top: 10px;
    }
</style>
</head>

<body>
  <a href="game.htm" > <p>play again</p></a>
<div class="side-barall">
			
		
	  <p><a href="home page.html"><img src="logo image/f4bab5e7-868e-3a2e-a32e-514c2b44f96e.png" alt="web logo" width="63" height="86"  id="web-logo"></a></p>
		<hr class="line">
			<div class="side-barmenu">
				<b><a href="cars.htm" class="item">cars</a>
                <br>
			    <a href="support.htm" class="item">support</a>
				<br>
				<a class="item" href="game.htm">game</a>
				<br>
				</b>
				
				
			</div>
	
</div>





<div id="game">
    <div id="car"></div>
    <div id="obstacle"></div>
</div>

<div id="message">Press SPACE to jump</div>

<script>
    const car = document.getElementById("car");
    const obstacle = document.getElementById("obstacle");
    let jumping = false;

    document.addEventListener("keydown", function(e) {
        if (e.code === "Space" && !jumping) {
            jumping = true;
            car.classList.add("jump");

            setTimeout(() => {
                car.classList.remove("jump");
                jumping = false;
            }, 600);
        }
    });

    setInterval(() => {
        const carTop = parseInt(window.getComputedStyle(car).bottom);
        const obstacleRight = parseInt(window.getComputedStyle(obstacle).right);

        if (obstacleRight > 700 && obstacleRight < 760 && carTop < 40) {
            document.getElementById("message").innerHTML = "Game Over! Refresh to play again.";
            obstacle.style.animation = "none";
        }
    }, 10);
</script>

</body>
</html>
